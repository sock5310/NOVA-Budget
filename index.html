:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky OS-style header + tab rail, one working panel per tab, max 1040px */
:root{
  --bg:#0a0d13; --surface:#11161f; --surface2:#171e2a; --line:#232d3d;
  --fg:#e5eaf2; --muted:#8793a8; --accent:#7cc4ff; --accent2:#b39cff;
  --good:#5fd39a; --bad:#ff7a85; --warn:#f0c46a;
  --f-display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;margin:0}
.brand h1 span{color:var(--accent)}
.brand .os{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

<body>
<div class="wrap">
<header class="top">
  <div class="topbar"><div class="brand">

  </div><div id="status" aria-live="polite"></div></div>
  <nav class="tabs" role="tablist" id="tabs">

    <button role="tab" data-tab="kop" data-tip="Skriv in vad du har köpt.">Köp</button>
    <button role="tab" data-tab="inkomster" data-tip="Lön, bidrag och andra pengar du får, med utbetalningsdag.">Inkomster</button>
    <button role="tab" data-tab="pren" data-tip="Hyra, boende, Netflix, Spotify och annat som dras varje månad.">Fasta kostnader</button>
    <button role="tab" data-tab="lan" data-tip="Lån och delbetalningar med ränta, avgifter och betalningsplan.">Lån</button>
    <button role="tab" data-tab="varor" data-tip="Alla varor appen känner igen och hur mycket du lagt på dem.">Varor</button>
    <button role="tab" data-tab="sim" class="sim" data-tip="Testa hur din ekonomi utvecklas framåt, upp till 10 år.">Simulation</button>
    <button role="tab" data-tab="valuta" data-tip="Växla mellan valutor och se växelkurser.">Valuta</button>
    <button role="tab" data-tab="inst" class="gear" data-tip="Inställningar för appen."><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg>Inställningar</button>
  </nav>
</header>
<main id="main"></main>
<div id="picker" class="picker" hidden><div class="pk-card" role="dialog" aria-modal="true" aria-label="Budget-Minne"></div></div>
<footer>NOVA Budget · Budget-OS 1 Beta · © NOVA Systems</footer>
</div>

<script>
(function(){
const KEY='nova-budget-v1';
const BASECATS=['Mat & dryck','Kläder','Spel','Nöje','Teknik','Transport','Hygien','Present','Skola','Övrigt'];
const cats=()=>[...BASECATS,...((S.settings&&S.settings.cats)||[])];
const ITYPES=['Lön','Studiebidrag','Present','Försäljning','Övrigt'];
const SUBCATS=['Streaming','Musik','Spel','Moln & lagring','Mobil & internet','Träning','Nyheter & tidningar','Appar','Övrigt'];
const icats=()=>[...ITYPES,...((S.settings&&S.settings.icats)||[])];
const scats=()=>[...SUBCATS,...((S.settings&&S.settings.scats)||[])];
const subCat=x=>x.category||'Övrigt';
const BILLCATS=['Hyra','El & värme','Försäkring','Bredband','Avgifter & förening','Lån till boende','Övrigt'];
const isBill=x=>x&&x.kind==='bill';
const bcats=()=>[...BILLCATS,...((S.settings&&S.settings.scats)||[])];
/* nyckel i budget och statistik: prenumerationer samlas, hyra och boende per kategori */
const subKey=x=>isBill(x)?subCat(x):'Prenumerationer';
const billTyp=x=>subCat(x)==='Hyra'?'Hyra':'Fast kostnad';
function catSel(id,list,sel){const l=[...list];if(sel&&!l.includes(sel))l.push(sel);
  return `<select id="${id}" data-newcat="1">${l.map(c=>`<option${c===sel?' selected':''}>${esc(c)}</option>`).join('')}<option value="__new">＋ Ny kategori…</option></select><input id="${id}New" class="newcat" placeholder="Namn på ny kategori" hidden>`}
function catVal(id,key,list){const v=document.getElementById(id).value;if(v!=='__new')return v;
  const n=(document.getElementById(id+'New').value||'').trim()||'Övrigt';if(!list.includes(n)){S.settings[key]=S.settings[key]||[];S.settings[key].push(n)}return n}
function chips(kind,items,cur){
  if(items.length<2&&cur==='all')return '';
  const g={};items.forEach(x=>{g[x.c]=g[x.c]||{n:0,sum:0};g[x.c].n++;g[x.c].sum+=x.a});
  const tot=items.reduce((a,x)=>a+x.a,0);
  return `<div class="chips">${[['all','Alla',items.length,tot],...Object.entries(g).sort((a,b)=>b[1].sum-a[1].sum).map(([c,o])=>[c,c,o.n,o.sum])].map(([k,t,n,sum])=>`<button type="button" class="fchip" data-act="filt" data-k="${kind}" data-c="${esc(k)}" aria-pressed="${cur===k}" data-tip="${esc(`${n} st · ${kr(sum)}`)}">${esc(t)} <span>${n}</span></button>`).join('')}</div>`}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* belopp: med ören om inställningen är på och beloppet inte är jämnt */
const showDec=()=>!(typeof S!=='undefined'&&S&&S.settings&&S.settings.decimals===false);
/* ---------- valutor och växelkurser ---------- */
const CURS=[['SEK','Svenska kronor','kr'],['EUR','Euro','€'],['USD','Amerikanska dollar','$'],['GBP','Brittiska pund','£'],['NOK','Norska kronor','NOK'],['DKK','Danska kronor','DKK'],
  ['CHF','Schweiziska franc','CHF'],['PLN','Polska złoty','zł'],['CZK','Tjeckiska kronor','Kč'],['HUF','Ungerska forint','Ft'],['ISK','Isländska kronor','ISK'],['TRY','Turkiska lira','TRY'],
  ['JPY','Japanska yen','¥'],['CNY','Kinesiska yuan','CNY'],['THB','Thailändska baht','฿'],['KRW','Sydkoreanska won','₩'],['INR','Indiska rupier','₹'],['CAD','Kanadensiska dollar','CAD'],
  ['AUD','Australiska dollar','AUD'],['NZD','Nyzeeländska dollar','NZD'],['MXN','Mexikanska pesos','MXN'],['BRL','Brasilianska real','R$'],['ZAR','Sydafrikanska rand','ZAR'],['AED','Emiratiska dirham','AED']];
const baseCur=()=>(typeof S!=='undefined'&&S&&S.settings&&S.settings.currency)||'SEK';
const curSym=c=>{const x=CURS.find(k=>k[0]===c);return x?x[2]:c};
const curName=c=>{const x=CURS.find(k=>k[0]===c);return x?x[1]:c};
const FXSRC=[
  {name:'Europeiska centralbanken (Frankfurter)',url:'https://api.frankfurter.app/latest?from=EUR',parse:j=>({...j.rates,EUR:1})},
  {name:'ExchangeRate-API',url:'https://open.er-api.com/v6/latest/EUR',parse:j=>j&&j.result==='success'?j.rates:null},
  {name:'Currency API (jsDelivr)',url:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json',alt:'https://latest.currency-api.pages.dev/v1/currencies/eur.json',
    parse:j=>{if(!j||!j.eur)return null;const o={};Object.entries(j.eur).forEach(([k,v])=>o[k.toUpperCase()]=v);return o}}];
const fx=()=>(S.settings&&S.settings.fx)||null;
/* kurs: hur många "to" för 1 "from", via euro */
function fxRate(from,to){if(from===to)return 1;const F=fx();if(!F||!F.rates[from]||!F.rates[to])return null;return F.rates[to]/F.rates[from]}
function conv(a,from,to){const r=fxRate(from,to||baseCur());return r==null?null:a*r}
let fxBusy=false,fxMsg='';
async function fxUpdate(force){
  if(fxBusy||typeof fetch!=='function')return;if(!navigator.onLine){fxMsg='offline';return}
  const F=fx();if(!force&&F&&Date.now()-F.at<30*60000)return;
  fxBusy=true;if(force&&(tab==='inst'||tab==='valuta'))render();
  const got=await Promise.all(FXSRC.map(async src=>{for(const u of [src.url,src.alt].filter(Boolean)){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const o=src.parse(await r.json());if(o&&o.SEK>0)return {name:src.name,rates:o}}catch(e){}}return {name:src.name,rates:null}}));
  const ok=got.filter(g=>g.rates);
  if(ok.length){const rates={EUR:1},spread={},count={};
    CURS.map(c=>c[0]).forEach(c=>{const v=ok.map(g=>+g.rates[c]).filter(x=>x>0).sort((a,b)=>a-b);if(!v.length)return;
      const med=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;rates[c]=med;count[c]=v.length;spread[c]=v.length>1?(v[v.length-1]-v[0])/med*100:0});
    S.settings.fx={rates,spread,count,at:Date.now(),sources:got.map(g=>({name:g.name,ok:!!g.rates}))};fxMsg='';save();
    if(!(typeof FS!=='undefined'&&FS.open))render()}
  else fxMsg='fail';
  fxBusy=false;if((tab==='inst'||tab==='valuta')&&!(typeof FS!=='undefined'&&FS.open))render();
}
const fxAge=()=>{const F=fx();if(!F)return '';const m=Math.round((Date.now()-F.at)/60000);return m<1?'nyss':m<60?`för ${m} min sedan`:m<1440?`för ${Math.round(m/60)} tim sedan`:`för ${Math.round(m/1440)} dagar sedan`};
function curOpts(sel){return CURS.map(([c,n])=>`<option value="${c}"${c===sel?' selected':''}>${c} · ${n}</option>`).join('')}
/* inställningar: bara standardvaluta */
function curSettingPanel(){
  const b=baseCur(),pend=curPend;
  return `<div class="panel" style="margin-top:16px"><h3>Valuta</h3>
    <label class="fl" style="max-width:360px" data-tip="Valutan alla belopp i appen visas i.">Min valuta<select id="baseCur">${curOpts(pend||b)}</select></label>
    ${pend&&pend!==b?`<div class="budwarn" style="margin-top:8px;max-width:520px">Byt till <b>${esc(curName(pend))}</b>? Befintliga belopp räknas inte om, bara valutan som visas ändras. Byt helst innan du lägger in dina siffror.
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" data-act="curOk">Byt valuta</button><button class="btn small ghost" data-act="curNo">Avbryt</button></div></div>`:''}
    <p class="hint" style="margin:8px 0 0">Växla och se växelkurser under fliken Valuta.</p>
  </div>`;
}
/* egen flik: växla och växelkurser */
const FXSHOW=['EUR','USD','GBP','NOK','DKK','CHF','PLN','JPY','THB','TRY','CNY','AUD','CAD'];
function vValuta(){
  const F=fx(),b=baseCur();const f=fcState.from||'USD',t=fcState.to||b;
  return `${banner()}
  <div class="row" style="margin-bottom:14px"><h2>Valuta</h2>
    <span class="mut" style="font-size:13px" data-tip="${esc('Växelkurserna hämtas från flera källor och jämförs. Appen använder mittvärdet, så ett fel hos en källa inte slår igenom. Utan internet används de senast hämtade kurserna.')}">${F?`Kurser ${fxAge()} · ${F.sources.filter(x=>x.ok).length} av ${F.sources.length} källor`:'Inga kurser hämtade än'}${navigator.onLine?'':' · offline'}</span></div>
  <div class="panel fxcalc">
    <h3>Växla</h3>
    <form data-form="fxCalc" autocomplete="off" class="fxrow">
      <label class="fl fxamt">Belopp<input id="fcAmt" type="text" inputmode="decimal" autocomplete="off" data-num value="${esc(fcState.amt)}"></label>
      <label class="fl">Från<select id="fcFrom">${curOpts(f)}</select></label>
      <button type="button" class="btn ghost fxswap" data-act="fxSwap" aria-label="Byt plats på valutorna" data-tip="Byt plats">⇄</button>
      <label class="fl">Till<select id="fcTo">${curOpts(t)}</select></label>
    </form>
    <div class="fxout"><span class="num" id="fcOut">${fcText()}</span><span class="mut" id="fcRate">${fcRateText()}</span></div>
    ${fxMsg==='fail'?'<p class="hint neg" style="margin:8px 0 0">Kunde inte nå någon källa just nu. Senaste kurserna används.</p>':''}
  </div>
  <div class="panel" style="margin-top:16px">
    <div class="row"><h3 style="margin:0">Växelkurser mot ${esc(b)}</h3>
      <button class="btn small ghost" data-act="fxNow"${fxBusy||!navigator.onLine?' disabled':''}>${fxBusy?'Hämtar…':navigator.onLine?'Uppdatera':'Offline'}</button></div>
    ${F?`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Valuta</th><th class="r">1 = ${esc(b)}</th><th class="r">1 ${esc(b)} =</th><th class="r" data-tip="Hur mycket källorna skiljer sig åt. Lågt är bra.">Skillnad</th></tr></thead><tbody>
      ${FXSHOW.filter(c=>c!==b).map(c=>{const r=fxRate(c,b);return r==null?'':`<tr class="hit" data-act="fxPick" data-c="${c}" style="cursor:pointer" data-tip="${esc(`${curName(c)}\nJämfört mellan ${F.count[c]||0} källor\nKlicka för att växla`)}"><td>${c} <span class="mut fxn">${esc(curName(c))}</span></td><td class="r num">${r.toLocaleString('sv-SE',{maximumFractionDigits:r<0.1?5:4})}</td><td class="r num">${(1/r).toLocaleString('sv-SE',{maximumFractionDigits:1/r<0.1?5:4})} ${c}</td><td class="r num mut">${F.spread[c]!=null?F.spread[c].toFixed(2).replace('.',',')+' %':'–'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="hint" style="margin-top:8px">Källor: ${F.sources.map(x=>`${esc(x.name)} ${x.ok?'✓':'✗'}`).join(' · ')}</p>`
    :`<div class="empty">${navigator.onLine?'Hämtar växelkurser…':'Offline. Växelkurserna hämtas automatiskt när du är online.'}</div>`}
  </div>`;
}
function fcRateText(){const f=fcState.from||'USD',t=fcState.to||baseCur();const r=fxRate(f,t);return r==null?'':`1 ${f} = ${r.toLocaleString('sv-SE',{maximumFractionDigits:r<0.1?6:4})} ${t}`}
let curPend=null;const fcState={amt:'100',from:'USD',to:null};
function fcText(){const a=+normNum(fcState.amt)||0,f=fcState.from||'USD',t=fcState.to||baseCur();const r=conv(a,f,t);
  return r==null?'Ingen kurs än':`${r.toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2})} ${t}`}
function pConvText(){const c=document.getElementById('pCur');const out=document.getElementById('pConv');if(!c||!out)return;
  const b=baseCur();if(c.value===b){out.textContent='';return}
  const a=nv(document.getElementById('pPrice'));const r=fxRate(c.value,b);
  out.innerHTML=r==null?'<span class="neg">Ingen växelkurs för '+esc(c.value)+' än. Gå online en stund så hämtas den.</span>'
    :`1 ${c.value} = ${r.toLocaleString('sv-SE',{maximumFractionDigits:4})} ${b}${a?` · ${a.toLocaleString('sv-SE')} ${c.value} ≈ <b>${kr(a*r)}</b>`:''}${fx()?` · kurs ${fxAge()}`:''}`}

function fmtKr(v){const o=Math.round(Math.abs(v)*100)/100;const dec=showDec()&&Math.round(o*100)%100!==0;
  return o.toLocaleString('sv-SE',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0})}
const CS=()=>curSym(baseCur());
const kr=n=>(Math.round(n*100)<0?'−':'')+fmtKr(n)+' '+CS();
const krs=n=>{const c=Math.round(n*100);return (c>0?'+':c<0?'−':'')+fmtKr(n)+' '+CS()};
const pad=n=>String(n).padStart(2,'0');
const normNum=x=>{const t=String(x??'').replace(/[\s\u00a0\u202f]/g,'').replace(',','.');return /^-?\d*\.?\d*$/.test(t)?t:''};
const nv=el=>el?(+normNum(el.value)||0):0;
const dstr=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
let TODAY=dstr(new Date());
let CUR=TODAY.slice(0,7);
const addD=(d,k)=>{const [y,m,dd]=d.split('-').map(Number);return dstr(new Date(y,m-1,dd+k))};
const ymOf=d=>d.slice(0,7);
function addM(ym,k){let [y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`}
function range(a,b){const o=[];let c=a;while(c<=b){o.push(c);c=addM(c,1)}return o}
function mLabel(ym,long){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('sv-SE',long?{month:'long',year:'numeric'}:{month:'short',year:'2-digit'})}
const MN=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const WD=['sön','mån','tis','ons','tor','fre','lör'];
function dLabel(d){const [y,m,dd]=d.split('-').map(Number);const w=new Date(y,m-1,dd).getDay();return `<span class="date">${WD[w]} ${dd} ${MN[m-1]} ${y}</span>`}
function mTag(ym){return `<span class="date">${mLabel(ym,true)}</span>`}
function axisLbl(x,y0,ym,hi){const [y,m]=ym.split('-').map(Number);return `<text x="${x}" y="${y0}" text-anchor="middle" class="am"${hi?' style="fill:var(--accent)"':''}>${MN[m-1]}</text><text x="${x}" y="${y0+14}" text-anchor="middle" class="ay">${y}</text>`}

function sample(){
  const m0=addM(CUR,-2),m1=addM(CUR,-1);
  const items=[
    {id:uid(),name:'Energidryck',category:'Mat & dryck',lastPrice:25},
    {id:uid(),name:'Pizza',category:'Mat & dryck',lastPrice:110},
    {id:uid(),name:'Hoodie',category:'Kläder',lastPrice:499},
    {id:uid(),name:'Spel (digitalt)',category:'Spel',lastPrice:699},
    {id:uid(),name:'Bio',category:'Nöje',lastPrice:150},
    {id:uid(),name:'USB-C-kabel',category:'Teknik',lastPrice:149}];
  const P=(i,d,q)=>({id:uid(),name:items[i].name,category:items[i].category,price:items[i].lastPrice,qty:q||1,date:d});
  return {settings:{startSaldo:2000,example:true,pins:['m:Mat & dryck','m:Nöje']},items,
    purchases:[P(0,m0+'-04',2),P(1,m0+'-12'),P(4,m0+'-20'),P(3,m0+'-27'),
      P(0,m1+'-03',3),P(2,m1+'-09'),P(1,m1+'-18'),P(5,m1+'-24'),
      P(0,CUR+'-02',2),P(4,CUR+'-08'),P(1,TODAY)],
    incomes:[
      {id:uid(),name:'Studiebidrag',type:'Studiebidrag',amount:1250,recurring:true,day:20,start:m0,end:null},
      {id:uid(),name:'Extrajobb',type:'Lön',amount:1800,recurring:true,day:25,start:m0,end:null},
      {id:uid(),name:'Sålde gamla hörlurar',type:'Försäljning',amount:400,recurring:false,date:m1+'-14'},
      {id:uid(),name:'Födelsedagspengar',type:'Present',amount:500,recurring:false,date:addM(CUR,1)+'-03'}],
    subs:[
      {id:uid(),name:'Netflix',category:'Streaming',amount:129,day:12,start:m0,end:null},
      {id:uid(),name:'Spotify',category:'Musik',amount:129,day:18,start:m0,end:null},
      {id:uid(),name:'iCloud+',category:'Moln & lagring',amount:39,start:m0,end:addM(CUR,-1)}],
    goals:[{id:uid(),name:'Ny dator',amount:15000}],
    budgets:{'Mat & dryck':800,'Spel':500,'Nöje':300},
    loans:[{id:uid(),kind:'part',name:'Hörlurar',amount:2400,rate:0,fee:29,months:12,first:m1,day:28,category:'Teknik',extras:[]}]};
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){if(S&&S.settings)S.settings.changedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof fsSchedule==='function')fsSchedule()}
let S=load()||sample();
if(!S.goals)S.goals=[];
if(!S.budgets)S.budgets={};

function pace(){
  const ms=months().filter(m=>m<CUR).slice(-3);
  const avg=ms.length?ms.reduce((a,m)=>a+stats(m).pSum,0)/ms.length:stats(CUR).pSum;
  const inc=S.incomes.filter(i=>i.recurring&&(!i.end||i.end>=addM(CUR,1))&&i.start<=addM(CUR,1)).reduce((a,i)=>a+amtAt(i,addM(CUR,1)),0);
  const subs=S.subs.filter(x=>!x.end).reduce((a,x)=>a+amtAt(x,addM(CUR,1)),0);
  const loans=(S.loans||[]).reduce((a,L)=>a+lnMonthPay(L,addM(CUR,1)),0);
  return {inc,subs,loans,avg,net:inc-subs-loans-avg,basis:ms.length};
}
function eta(amount,extra){
  const P=pace();let sal=saldoNow()-(extra||0);
  if(sal>=amount)return {k:0,ym:CUR,sal,P,done:true};
  /* resten av den här månaden: inkomster som inte kommit än */
  sal+=pendingThisMonth();
  if(sal>=amount)return {k:0,ym:CUR,sal,P};
  for(let k=1;k<=120;k++){const m=addM(CUR,k);
    sal+=S.incomes.reduce((a,i)=>a+(i.recurring&&activeIn(i,m)?amtAt(i,m):0),0)-S.subs.reduce((a,x)=>a+(x.start<=m&&(!x.end||x.end>=m)?amtAt(x,m):0),0)-(S.loans||[]).reduce((a,L)=>a+lnMonthPay(L,m),0)-P.avg;
    S.incomes.forEach(i=>{if(!i.recurring&&ymOf(i.date)===m)sal+=i.amount});
    if(sal>=amount)return {k,ym:m,sal,P}}
  return {k:-1,P,sal};
}

function incRange(i,ref){const ds=occ(i,addM(ymOf(ref),2)).map(o=>o.d);const prev=ds.filter(d=>d<=ref).pop(),next=ds.find(d=>d>ref);

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function ticks(min,max){if(max===min){max+=1000;}const st=niceStep((max-min)/4);const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st;const t=[];for(let v=lo;v<=hi+1e-6;v+=st)t.push(v);return t}
const shortKr=v=>Math.abs(v)>=100000?Math.round(v/1000).toLocaleString('sv-SE')+'k':Math.round(v).toLocaleString('sv-SE');

function barChart(ms){
  const data=ms.map(m=>{const s=stats(m);return {m,i:s.iSum,e:s.exp}});
  const W=Math.max(560,data.length*60+70),H=250,L=58,R=12,T=12,B=44;
  const max=Math.max(1,...data.map(d=>Math.max(d.i,d.e)));
  const tk=ticks(0,max),top=tk[tk.length-1];
  const y=v=>T+(H-T-B)*(1-v/top);
  const cw=(W-L-R)/data.length,bw=Math.min(18,cw/3);
  let g='';
  tk.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${shortKr(v)}</text>`});
  data.forEach((d,k)=>{const cx=L+cw*k+cw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(d.i)}" width="${bw}" height="${Math.max(0,y(0)-y(d.i))}" rx="2" fill="var(--good)"/>`;
    g+=`<rect x="${cx+1}" y="${y(d.e)}" width="${bw}" height="${Math.max(0,y(0)-y(d.e))}" rx="2" fill="var(--bad)"/>`;
    g+=`<rect class="hit" x="${L+cw*k}" y="${T}" width="${cw}" height="${H-T}" fill="transparent" data-act="pickMonth" data-m="${d.m}" data-tip="${esc(`<b>${mLabel(d.m,true)}</b>\nInkomster: ${kr(d.i)}\nUtgifter: ${kr(d.e)}\nKvar: ${krs(d.i-d.e)}\nKlicka för att visa månaden`)}"/>`;
    g+=axisLbl(cx,H-B+18,d.m,d.m===selMonth)});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Inkomster och utgifter per månad">${g}</svg>`;
}
function lineChart(series,n,startYm,cur,goal,tips){
  const W=760,H=310,L=64,R=16,T=14,B=44;
  const all=series.flatMap(s=>s.vals);
  const tk=ticks(Math.min(0,...all),Math.max(...all));
  const lo=tk[0],hi=tk[tk.length-1];
  const x=k=>L+(W-L-R)*k/n,y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';
  tk.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"${v===0&&lo<0?' stroke-dasharray="0" style="stroke:var(--muted)"':''}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${shortKr(v)}</text>`});
  const st=n<=12?3:n<=36?6:12;
  for(let k=0;k<=n;k+=st){g+=axisLbl(x(k),H-B+18,addM(startYm,k),k===0)}
  if(goal>0&&goal>=lo&&goal<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${W-R}" y="${y(goal)-6}" text-anchor="end" style="fill:var(--good)">Mål ${shortKr(goal)}</text>`;
  series.forEach(s=>{
    const pts=s.vals.map((v,k)=>`${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if(s.area)g+=`<polygon points="${x(0)},${y(Math.max(lo,0))} ${pts} ${x(n)},${y(Math.max(lo,0))}" fill="${s.color}" fill-opacity=".1"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.5:2.5}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linejoin="round"/>`;
    const lv=s.vals[n];g+=`<circle cx="${x(n)}" cy="${y(lv)}" r="4" fill="${s.color}"/>`;
  });
  if(cur!=null){const cv=series[series.length-1].vals[cur];g+=`<line x1="${x(cur)}" x2="${x(cur)}" y1="${T}" y2="${H-B}" stroke="var(--fg)" stroke-opacity=".5" stroke-width="1"/><circle cx="${x(cur)}" cy="${y(cv)}" r="5" fill="var(--bg)" stroke="var(--fg)" stroke-width="2"/>`;}
  if(tips){const hw=(W-L-R)/n;for(let k=1;k<=n;k++)g+=`<rect class="hit" x="${x(k)-hw/2}" y="${T}" width="${hw}" height="${H-B-T}" fill="transparent" data-act="simPick" data-k="${k}" data-tip="${esc(tips[k])}"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Saldoprognos">${g}</svg>`;
}

function ymToK(ym){const [y1,m1]=CUR.split('-').map(Number),[y2,m2]=ym.split('-').map(Number);return (y2-y1)*12+(m2-m1)}

function simInit(){
  const P=pace();
  const sal=Math.round(saldoNow()+pendingThisMonth());
  const ev=S.incomes.filter(i=>!i.recurring&&i.date>TODAY&&ymOf(i.date)>CUR).map(i=>({kind:'income',name:i.name,amount:i.amount,freq:'once',from:ymToK(ymOf(i.date)),to:null,real:true})).filter(e=>e.from>=1&&e.from<=120);
  const base1=addM(CUR,1);
  [[S.incomes.filter(i=>i.recurring&&!i.end),1],[S.subs.filter(x=>!x.end),-1]].forEach(([list,sg])=>list.forEach(x=>{
    const ch=(x.changes||[]).filter(c=>c.from>base1).sort((p,q)=>p.from.localeCompare(q.from));
    ch.forEach((c,j)=>{const d=(c.amount-amtAt(x,base1))*sg;if(!d)return;const from=ymToK(c.from);if(from>120)return;
      const nx=ch[j+1];ev.push({kind:d>0?'income':'cost',name:`${x.name}: nytt belopp ${kr(c.amount)}`,amount:Math.abs(d),freq:'monthly',from,to:nx?ymToK(nx.from)-1:null,real:true})})}));
  (S.loans||[]).forEach(L=>{let cur=null;sch(L).forEach(p=>{const k=ymToK(p.m);if(k<1||k>120)return;const a=Math.round(p.pay);
    if(cur&&cur.amount===a&&cur.to===k-1)cur.to=k;else{cur={kind:'cost',name:`${L.name} (${L.kind==='loan'?'lån':'delbetalning'})`,amount:a,freq:'monthly',from:k,to:k,real:true};ev.push(cur)}})});
  return {start:sal,baseStart:sal,baseSubs:P.subs,income:P.inc,baseIncome:P.inc,variable:Math.round(P.avg),baseVariable:Math.round(P.avg),
    varPct:0,infl:0,rate:0,goal:S.goals[0]?gNeed(sortedGoals()[0]):0,years:5,cursor:1,table:false,evFreq:'once',
    subs:S.subs.filter(x=>!x.end).map(x=>({name:x.name,amount:amtAt(x,addM(CUR,1)),on:true})),
    events:ev};
}
function simZero(){const b=Sim||simInit();return {...b,start:0,income:0,variable:0,varPct:0,infl:0,rate:0,goal:0,cursor:1,table:false,subs:[],events:[],zero:true}}
function project(base){
  const n=Sim.years*12,r=Sim.rate/100/12;
  const st=base?Sim.baseStart:Sim.start;
  const rows=[{k:0,saldo:st}];let s=st,firstNeg=-1,goalK=-1;
  for(let k=1;k<=n;k++){
    const f=Math.pow(1+Sim.infl/100,(k-1)/12);
    const inc=base?Sim.baseIncome:Sim.income;
    const vari=(base?Sim.baseVariable:Sim.variable*(1+Sim.varPct/100))*f;
    const subs=(base?Sim.baseSubs:Sim.subs.reduce((a,x)=>a+(x.on?x.amount:0),0))*f;
    const ev=(base?(Sim.baseEvents||Sim.events.filter(x=>x.real)):Sim.events).filter(e=>(e.freq==='once'?e.from===k:(e.from<=k&&(e.to==null||e.to>=k))));
    const evNet=ev.reduce((a,e)=>a+(e.kind==='income'?e.amount:-e.amount),0);
    const interest=s>0?s*r:0;
    const net=inc-vari-subs+evNet+interest;
    s+=net;
    rows.push({k,ym:addM(CUR,k),inc,vari,subs,ev,interest,net,saldo:s});
    if(s<0&&firstNeg<0)firstNeg=k;
    if(Sim.goal>0&&s>=Sim.goal&&goalK<0)goalK=k;
  }
  if(Sim.goal>0&&st>=Sim.goal)goalK=0;
  return {rows,v:rows.map(x=>x.saldo),firstNeg,goalK};
}

function render(keepFocus){

    else{const B=(S.pbudgets||[]).find(x=>x.id===key.slice(2));if(B){
      const per=document.getElementById('ebPer')?v('ebPer'):B.period;B.period=per;if(per==='income'){const ei=document.getElementById('ebInc');B.inc=(ei&&ei.value)||B.inc||(recInc()[0]||{}).id}B.cat=catVal('ebCat','cats',[ALLC,...cats(),'Prenumerationer',...BILLCATS,LCAT]);
      if(ebMode==='pct'){B.pct=Math.min(100,Math.max(0.01,val));delete B.amount}else{B.amount=Math.max(1,val);delete B.pct}
      if(per==='days'){const st=document.getElementById('ebStart');const nm=document.getElementById('ebName');B.name=((nm&&nm.value)||B.name||'Egen period').trim();B.start=(st&&st.value)||B.start||TODAY;
        const dd=document.getElementById('ebDays');const n=Math.max(1,Math.round(+(dd&&dd.value)||7));B.end=addD(B.start,n-1)}}}
    editBud=null;ebErr='';commit();return}
  if(f==='minKeep'){S.settings.minKeep=Math.max(0,+v('minKeep')||0);commit();return}
  if(f==='budget'&&bPer!=='month'){const c=catVal('bCat','cats',[ALLC,...cats(),'Prenumerationer',...BILLCATS.filter(x=>x!=='Övrigt'),LCAT]);const val=+v('bAmt')||0;
    if(bPer==='income'&&!document.getElementById('bInc'))return;
    const B={id:uid(),period:bPer,cat:c};if(bPer==='income')B.inc=v('bInc');if(bMode==='pct')B.pct=Math.min(100,Math.max(0.01,val));else B.amount=Math.max(1,val);
    if(bPer==='days'){B.name=v('bName').trim()||'Egen period';B.start=v('bStart')||TODAY;B.end=addD(B.start,Math.max(1,Math.round(+v('bDays')||1))-1)}
    S.pbudgets.push(B);commit();return}
  if(f==='budget'){const c=catVal('bCat','cats',[...cats(),'Prenumerationer',...BILLCATS.filter(x=>x!=='Övrigt'),LCAT]);S.budgets[c]=bMode==='pct'?{pct:Math.min(100,Math.max(0.01,+v('bAmt')||0))}:Math.max(1,+v('bAmt')||0);commit()}
  if(f==='goalEdit'){const g=S.goals.find(x=>x.id===editG);if(g){g.name=v('geName').trim()||g.name;g.amount=Math.max(1,+v('geAmt')||g.amount);g.keep=Math.max(0,+v('geKeep')||0)}editG=null;commit()}
  if(f==='goal'){S.goals.push({id:uid(),name:v('gName').trim(),amount:Math.max(1,+v('gAmt')||1),keep:Math.max(0,+v('gKeep')||0)});commit()}
  if(f==='purchase'){
    const before=S.goals.map(g=>etaText(eta(gNeed(g))));
    const pcur=v('pCur')||baseCur(),praw=Math.max(0,+v('pPrice')||0);let orig=null;let pconv=praw;
    if(pcur!==baseCur()){const r=fxRate(pcur,baseCur());if(r==null){const el=document.getElementById('pConv');if(el)el.innerHTML='<span class="neg">Ingen växelkurs för '+esc(pcur)+' än. Köpet sparades inte. Gå online en stund så hämtas kursen.</span>';return}
      pconv=praw*r;orig={cur:pcur,amount:praw,rate:r,at:(fx()||{}).at||Date.now()}}
    const name=v('pName').trim(),cat=catVal('pCat','cats',cats()),price=pconv,qty=Math.max(1,Math.round(+v('pQty')||1)),date=v('pDate')||TODAY;
    if(!name)return;
    let it=findItem(name);
    if(!it){it={id:uid(),name,category:cat,lastPrice:price};S.items.push(it)}else{it.category=cat;it.lastPrice=price}
    const prevP=editP?S.purchases.find(p=>p.id===editP):null;const nw=new Date();
    const rec={id:editP||uid(),name:it.name,category:cat,price,qty,date};if(orig)rec.orig=orig;
    if(prevP&&prevP.t!=null&&prevP.date===date)rec.t=prevP.t;else if(!editP&&date===TODAY)rec.t=nw.getHours()*60+nw.getMinutes();
    if(editP){S.purchases=S.purchases.map(p=>p.id===editP?rec:p);editP=null}else S.purchases.push(rec);
    autoPrice=false;save();
    goalMsg=S.goals.map((g,k)=>{const now=etaText(eta(gNeed(g)));return now===before[k]?`${esc(g.name)}: du når fortfarande målet <b>${now}</b>.`:`${esc(g.name)}: målet nås nu <b>${now}</b> (förut ${before[k]}).`}).join('<br>');
    const br=S.budgets[cat]&&ymOf(date)===CUR?budgetRows(CUR).find(r=>r.c===cat):null;
    budMsg=br&&br.lvl!=='ok'?(br.lvl==='over'?`<b>${esc(cat)}</b>: du har gått över månadsbudgeten med ${kr(-br.left)}.`:`<b>${esc(cat)}</b>: ${Math.round(br.pct)} % av månadsbudgeten är använd, ${kr(br.left)} kvar.`):'';
    const pbm=date<=TODAY?pbRowsActive().filter(r=>r.lvl!=='ok'&&(r.B.cat===ALLC||r.B.cat===cat)).map(r=>`<b>${esc(pbLabel(r.B,r.a,r.b))}</b>: ${r.lvl==='over'?`du har gått över budgeten med ${kr(-r.left)}.`:`${Math.round(r.pct)} % använd, ${kr(r.left)} kvar.`}`):[];
    if(pbm.length)budMsg=[budMsg,...pbm].filter(Boolean).join('<br>');
    render();goalMsg='';budMsg='';document.getElementById('pName')?.focus()}
  if(f==='income'){
    const rec=iRec;
    const old=editI?S.incomes.find(i=>i.id===editI):null;
    const newAmt=Math.max(0,+v('iAmt')||0);
    const o={id:editI||uid(),name:v('iName').trim(),type:catVal('iType','icats',icats()),amount:newAmt,recurring:rec};
    if(old&&old.recurring&&rec){o.amount=old.amount;if(old.changes)o.changes=old.changes.map(c=>({...c}));o.start=v('iWhen')||old.start;applyAmount(o,newAmt,chMode,document.getElementById('chFrom')?.value||CUR)}
    if(rec){o.day=+v('iDay')||1;o.shift=v('iShift')||'before';o.start=v('iWhen')||CUR;o.end=old&&old.recurring?old.end:null}else o.date=v('iWhen')||TODAY;
    if(editI){S.incomes=S.incomes.map(i=>i.id===editI?o:i);editI=null;iRec=true}else S.incomes.push(o);
    commit()}
  if(f==='sub'){const amt=Math.max(0,+v('sAmt')||0);
    if(editS){const x=S.subs.find(q=>q.id===editS);if(x){x.name=v('sName').trim();x.category=catVal('sCat','scats',isBill(x)?bcats():scats());if(isBill(x))x.shift=v('sShift')||'after';x.day=+v('sDay')||1;x.start=v('sStart')||x.start;applyAmount(x,amt,chMode,document.getElementById('chFrom')?.value||CUR)}editS=null;commit()}
    else{const o={id:uid(),name:v('sName').trim(),category:catVal('sCat','scats',sKind==='bill'?bcats():scats()),amount:amt,day:+v('sDay')||1,start:v('sStart')||CUR,end:null};
      if(sKind==='bill'){o.kind='bill';o.shift=v('sShift')||'after'}S.subs.push(o);commit()}}
  if(f==='cat'){const c=v('newCat').trim(),k=v('newCatKind');const all={cats:cats(),icats:icats(),scats:scats()}[k];S.settings[k]=S.settings[k]||[];if(c&&!all.includes(c))S.settings[k].push(c);commit()}
  if(f==='simEvent'){const from=ymToK(v('evFrom'));if(from<1||from>120)return;
    let to=null;const te=document.getElementById('evTo');if(te&&te.value){to=ymToK(te.value);if(to<from)to=from}
    Sim.events.push({kind:Sim.evKind==='income'?'income':'cost',name:v('evName').trim(),amount:Math.max(0,+v('evAmt')||0),freq:Sim.evFreq,from,to});
    if(from>Sim.years*12)Sim.years=Math.min(10,Math.ceil(from/12));Sim.cursor=from;render()}
});
/* ---------- förslag när man skriver ---------- */
const setV=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v};
function uniqBy(l){const m=new Map();l.forEach(x=>m.set(x.name.trim().toLowerCase(),x));return [...m.values()]}
const SUG={
  pName:()=>S.items.map(i=>({n:i.name,sub:`${i.category} · ${kr(i.lastPrice)}`,fill:()=>{setV('pCat',i.category);setV('pPrice',i.lastPrice);autoPrice=true;pHint()}})),
  iName:()=>uniqBy(S.incomes).map(i=>({n:i.name,sub:`${i.type} · ${kr(i.amount)}`,fill:()=>{setV('iType',i.type);setV('iAmt',i.amount);if(i.day)setV('iDay',i.day);if(i.shift)setV('iShift',i.shift)}})),
  sName:()=>uniqBy(S.subs).map(x=>({n:x.name,sub:`${kr(x.amount)}/mån`,fill:()=>{setV('sAmt',amtAt(x,CUR));if(x.day)setV('sDay',x.day);setV('sCat',subCat(x));if(x.shift)setV('sShift',x.shift)}})),
  evName:()=>Sim&&Sim.evKind==='income'
    ?uniqBy(S.incomes).map(i=>({n:i.name,sub:kr(i.amount),fill:()=>setV('evAmt',i.amount)}))
    :[...S.items.map(i=>({n:i.name,sub:kr(i.lastPrice),fill:()=>setV('evAmt',i.lastPrice)})),...uniqBy(S.subs).map(x=>({n:x.name,sub:`${kr(x.amount)}/mån`,fill:()=>setV('evAmt',x.amount)}))]
};
let ac={id:null,list:[],hi:-1};
function hlq(n,q){const e=esc(n);if(!q)return e;const k=n.toLowerCase().indexOf(q);return k<0?e:esc(n.slice(0,k))+'<b>'+esc(n.slice(k,k+q.length))+'</b>'+esc(n.slice(k+q.length))}
function acShow(inp){
  const box=document.getElementById('sg-'+inp.id);if(!box)return;
  const q=inp.value.trim().toLowerCase();
  let l=SUG[inp.id]().filter(o=>!q||o.n.toLowerCase().includes(q));
  l.sort((a,b)=>(b.n.toLowerCase().startsWith(q))-(a.n.toLowerCase().startsWith(q))||a.n.localeCompare(b.n,'sv'));
  if(q&&l.length===1&&l[0].n.toLowerCase()===q)l=[];
  ac={id:inp.id,list:l.slice(0,6),hi:-1};
  if(!ac.list.length){box.hidden=true;return}
  box.innerHTML=`<div class="sgh">${q?'Matchar':'Tidigare namn'}</div>`+ac.list.map((o,k)=>`<button type="button" class="sg" data-sg="${k}" tabindex="-1"><span>${hlq(o.n,q)}</span><span class="mut">${esc(o.sub)}</span></button>`).join('');
  box.hidden=false;
}
function acHide(){if(ac.id){const b=document.getElementById('sg-'+ac.id);if(b)b.hidden=true}ac={id:null,list:[],hi:-1}}
function acPick(k){const o=ac.list[k];if(!o)return;const inp=document.getElementById(ac.id);inp.value=o.n;o.fill();acHide();inp.focus()}
main.addEventListener('input',e=>{if(SUG[e.target.id])acShow(e.target)});
main.addEventListener('focusin',e=>{if(SUG[e.target.id])acShow(e.target)});
main.addEventListener('focusout',e=>{if(SUG[e.target.id])setTimeout(()=>{if(document.activeElement!==e.target)acHide()},150)});
main.addEventListener('mousedown',e=>{const b=e.target.closest('.sg');if(b){e.preventDefault();acPick(+b.dataset.sg)}});
main.addEventListener('keydown',e=>{
  if(!ac.id||e.target.id!==ac.id||!ac.list.length)return;
  const box=document.getElementById('sg-'+ac.id);if(!box||box.hidden)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ac.hi=(ac.hi+(e.key==='ArrowDown'?1:-1)+ac.list.length)%ac.list.length;
    box.querySelectorAll('.sg').forEach((b,k)=>b.classList.toggle('hi',k===ac.hi))}
  else if(e.key==='Enter'&&ac.hi>=0){e.preventDefault();acPick(ac.hi)}
  else if(e.key==='Escape'){acHide()}
});

/* ---------- info när man håller musen över ---------- */
const tip=document.createElement('div');tip.id='tip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);
let tipEl=null;
function placeTip(x,y){const r=tip.getBoundingClientRect();let l=x+14,t=y+18;
  if(l+r.width>innerWidth-8)l=Math.max(8,x-r.width-14);if(t+r.height>innerHeight-8)t=Math.max(8,y-r.height-14);
  tip.style.left=l+'px';tip.style.top=t+'px'}
function showTip(el,x,y){tipEl=el;tip.innerHTML=el.getAttribute('data-tip').split(/(<b>.*?<\/b>)/).map(p=>p.startsWith('<b>')?'<b>'+esc(p.slice(3,-4))+'</b>':esc(p)).join('');tip.hidden=false;placeTip(x,y)}
function hideTip(){tipEl=null;tip.hidden=true}
const noHover=()=>window.matchMedia&&window.matchMedia('(hover: none)').matches;
document.addEventListener('mouseover',e=>{if(noHover()){hideTip();return}const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!e.target.closest('.sugg')){if(el!==tipEl)showTip(el,e.clientX,e.clientY)}else hideTip()});
document.addEventListener('mousemove',e=>{if(tipEl)placeTip(e.clientX,e.clientY)});
document.addEventListener('focusin',e=>{if(noHover())return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&e.target.matches(':focus-visible')){const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom)}});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
main.addEventListener('click',hideTip,true);

function markSeen(){S.settings.lastSeen={date:TODAY,time:Date.now()};save()}
markSeen();
setInterval(()=>{
  const t=dstr(new Date());
  if(t!==TODAY){const wasToday=selDay===TODAY;TODAY=t;CUR=t.slice(0,7);if(wasToday)selDay=TODAY;Sim=null;markSeen();
    if(!document.activeElement||!main.contains(document.activeElement)||document.activeElement===document.body)render()}
  const c=document.getElementById('clock');if(c)c.textContent=clockText();
},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=dstr(new Date());if(t!==TODAY){prevSeen=S.settings.lastSeen;TODAY=t;CUR=t.slice(0,7);selDay=TODAY;Sim=null;markSeen();render()}}});

/* testversionen: enkel status. Den nedladdade appen ersätter den med Budget-Minne-menyn */
function webStatus(){if(typeof FS!=='undefined')return;const el=document.getElementById('status');if(!el)return;const on=navigator.onLine;
  el.innerHTML=`<span class="st ${on?'on':'off'}" data-tip="${esc(on?'<b>Online</b>\nVäxelkurser och röda dagar hämtas från internet när det går.':'<b>Offline</b>\nKörs lokalt med de senast hämtade uppgifterna.')}"><i></i>${on?'Online':'Offline'}</span><span class="st warn" data-tip="${esc('<b>Testversion</b>\nDet här är testversionen i chatten. Den sparar bara i webbläsaren.\nBudget-Minne och val av datamapp finns i den nedladdade appen (NOVA Budget.zip).')}">Testversion</span>`}
webStatus();window.addEventListener('online',webStatus);window.addEventListener('offline',webStatus);
setTimeout(()=>fxUpdate(),600);window.addEventListener('online',()=>fxUpdate());setInterval(()=>fxUpdate(),30*60000);
async function pickerClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,c=b.dataset.c;
  if(a==='memMenu')return memMenu();
  if(a==='goInst'){tab='inst';render();return}
  if(a==='fsPick')return fsPick();
  if(a==='fsGrant')return fsGrant();
  if(a==='memClose'){FS.open=false;renderPicker();return}
  if(a==='memSkip'){FS.open=false;FS.boot=false;renderPicker();updateStatus();return}
  if(a==='memOpen'){if(c===FS.mem&&!FS.boot){FS.open=false;renderPicker();return}return fsOpen(c)}
  if(a==='memNewView'){FS.view='new';FS.err='';renderPicker();document.getElementById('mnName')?.focus();return}
  if(a==='memBack'){FS.view='list';FS.err='';renderPicker();return}
  if(a==='memEdit'){FS.edit=c;FS.delPend=null;renderPicker();const i=document.getElementById('mrName');if(i){i.focus();i.select()}return}
  if(a==='memEditCancel'){FS.edit=null;renderPicker();return}
  if(a==='memDel'){if(FS.delPend!==c){FS.delPend=c;renderPicker();return}return fsDelete(c)}
  if(a==='fileSave')return fileSave();
  if(a==='fileOpen')return fileOpenPick();
  if(a==='fileApply'){FS.err='';return fileApply()}
  if(a==='fileCancel'){filePend=null;FS.err='';FS.view='file';renderPicker();return}
  if(a==='fileNew'){if(!FS.newPend){FS.newPend=true;renderPicker();return}return fileNew()}
}
document.getElementById('status').addEventListener('click',pickerClick);
document.getElementById('picker').addEventListener('click',e=>{if(e.target.id==='picker'&&!FS.boot){FS.open=false;renderPicker();return}pickerClick(e)});
document.getElementById('picker').addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==='memNew')fsCreate(document.getElementById('mnName').value,{settings:{startSaldo:0,example:false}});
  if(f==='memRename')fsRename(FS.edit,document.getElementById('mrName').value);
  if(f==='memName'){const n=cleanName(document.getElementById('fmName').value);if(n){S.settings.memName=n;save();FS.msg='Namnet är sparat.';renderPicker();updateStatus()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&FS.open&&!FS.boot){FS.open=false;renderPicker()}});
render();
updateStatus();
fsInit().then(netCheck);
window.addEventListener('online',netCheck);window.addEventListener('offline',netCheck);
setInterval(netCheck,5*60000);
})();
